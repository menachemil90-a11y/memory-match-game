name: Install test (diagnostic)
on:
  push:
    branches: [diag-install]
  workflow_dispatch:
jobs:
  install:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [34, 35, 36]
    steps:
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Download release APK
        run: |
          curl -sL -o mm.apk https://github.com/${{ github.repository }}/releases/latest/download/memory-match.apk
          ls -l mm.apk; sha256sum mm.apk
      - name: Fresh install on Android API ${{ matrix.api }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            adb shell getprop ro.build.version.release
            adb shell getprop ro.product.cpu.abilist
            adb install mm.apk && echo "RESULT: adb install OK" || echo "RESULT: adb install FAILED"
            adb uninstall com.placeholder.memorymatch || true
            adb push mm.apk /data/local/tmp/mm.apk
            adb shell 'S=$(pm install-create -S 84523498 | grep -o "[0-9]*"); cat /data/local/tmp/mm.apk | pm install-write -S 84523498 $S base.apk; pm install-commit $S' && echo "RESULT: session install OK" || echo "RESULT: session install FAILED"
            adb shell pm list packages | grep memorymatch || true
            adb logcat -d | grep -i -E "PackageManager|PackageInstaller|INSTALL_" | tail -40 || true

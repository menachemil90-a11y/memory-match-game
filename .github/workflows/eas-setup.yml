name: EAS project setup

# One-time: creates/links the Expo (EAS) project for this app using the
# repository secret EXPO_TOKEN, and prints the public project id so it can be
# committed to app.json (extra.eas.projectId + updates.url). Safe to re-run:
# it only links the existing project. The token is never printed.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  init:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Hide the Expo account email in logs (logs of this public repo are public)
        run: |
          email=$(npx eas-cli@latest whoami 2>/dev/null | grep -o '[^[:space:]]*@[^[:space:]]*' | head -1 || true)
          if [ -n "$email" ]; then echo "::add-mask::$email"; fi

      - name: Create or link the EAS project
        run: npx eas-cli@latest init --non-interactive --force

      - name: Print the project id (public, not a secret)
        run: |
          node -e "const e=require('./app.json').expo; console.log('EAS_PROJECT_ID=' + (e.extra && e.extra.eas && e.extra.eas.projectId)); console.log('EAS_OWNER=' + e.owner)"
          npx eas-cli@latest project:info

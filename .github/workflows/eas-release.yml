name: EAS release (store builds)

# Store builds in Expo's cloud (EAS Build) and optional upload to the stores
# (EAS Submit). Run from the Actions tab → "EAS release" → Run workflow.
# Needs the repository secret EXPO_TOKEN (expo.dev → Access tokens).
on:
  workflow_dispatch:
    inputs:
      platform:
        description: android, ios or all
        default: android
        required: true
      profile:
        description: EAS build profile (production, preview, development)
        default: production
        required: true
      submit:
        description: Upload to the store after building (true/false)
        default: 'false'
        required: true
      wait:
        description: Wait for the build to finish and fail this run if it fails (true/false)
        default: 'false'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      # Online play: the public Supabase URL + anon key come from the committed .env
      # (do not set them here — an empty variable would override .env).
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Hide the Expo account email in logs (logs of this public repo are public)
        run: |
          email=$(npx eas-cli@latest whoami 2>/dev/null | grep -o '[^[:space:]]*@[^[:space:]]*' | head -1 || true)
          if [ -n "$email" ]; then echo "::add-mask::$email"; fi
      - run: npm run check
      - name: EAS build
        env:
          PLATFORM: ${{ inputs.platform }}
          PROFILE: ${{ inputs.profile }}
          SUBMIT: ${{ inputs.submit }}
          WAIT: ${{ inputs.wait }}
        run: |
          EXTRA=""
          if [ "$SUBMIT" = "true" ]; then EXTRA="--auto-submit"; fi
          if [ "$WAIT" = "true" ]; then EXTRA="$EXTRA --wait"; else EXTRA="$EXTRA --no-wait"; fi
          npx eas-cli@latest build --non-interactive --platform "$PLATFORM" --profile "$PROFILE" $EXTRA

name: Android test APK

# Builds an installable APK without an Expo account and publishes it as the
# repository's latest GitHub release (also as memory-match.apk, the web game's
# download link). Triggered by a commit whose message contains "[apk]",
# a pushed tag "apk-*", or manually from the Actions tab.
on:
  push:
    branches: ['**']
    tags: ['apk-*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/apk-') ||
      contains(github.event.head_commit.message, '[apk]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Job-level (not workflow-level): pushes without [apk] start a run whose job
    # is skipped; at workflow level that run would cancel a build in progress.
    concurrency:
      group: android-apk-${{ github.ref }}
      cancel-in-progress: true
    env:
      # NODE_ENV=production is set only on the build steps below: at job level it
      # would make `npm ci` skip devDependencies and break `npm run check`.
      EXPO_NO_TELEMETRY: '1'
      # Over-the-air updates published to the "preview" channel reach test APKs
      # (see app.config.js; EAS builds take their channel from eas.json).
      EXPO_UPDATES_CHANNEL: preview
      # In-app "new version available" for test APKs (see app.config.js): the run
      # number becomes the versionCode, and the app looks for newer test APKs in
      # this repository's Releases.
      APK_BUILD_NUMBER: ${{ github.run_number }}
      APK_RELEASES_REPO: ${{ github.repository }}
      # Online play: the public Supabase URL + anon key come from the committed .env
      # (do not set them here — an empty variable would override .env).
      # Gradle memory, parallel workers and CPU architectures come from
      # plugins/withAndroidBuildResources.js (same values as EAS cloud builds).
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install JS dependencies
        run: npm ci

      - name: Verify (typecheck, lint, tests)
        run: npm run check

      - name: Generate native Android project
        env:
          NODE_ENV: production
        run: npx expo prebuild --platform android --no-install --clean

      - name: Use the stable test-build signing key
        run: cp credentials/sideload.keystore android/app/debug.keystore

      - name: Build release APK
        working-directory: android
        env:
          NODE_ENV: production
        run: |
          # Log free memory once a minute, so a future out-of-memory failure is visible.
          ( while sleep 60; do echo "[memory] $(free -m | awk 'NR==2 {print $3 " MB used, " $7 " MB available"}')"; done ) &
          ./gradlew assembleRelease --no-daemon

      - name: Name the APK
        id: apk
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          NAME="memory-match-${VERSION}-${GITHUB_SHA::7}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          ls -lh "$NAME"

      - name: Check it installs over the app on the phones (same key, newer build)
        # Android installs an update over the installed app (keeping boards and
        # scores) only when it is signed with the same certificate and has a higher
        # versionCode. Anything else would force testers to uninstall: never publish it.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/verify-apk.mjs "${{ steps.apk.outputs.name }}"
          NEWEST=$(gh release list --limit 200 --json tagName --jq '[.[].tagName | capture("^apk-[0-9.]+-build(?<n>[0-9]+)$") | .n | tonumber] | max // 0')
          echo "versionCode ${GITHUB_RUN_NUMBER}, newest published build ${NEWEST}"
          if [ "$GITHUB_RUN_NUMBER" -le "$NEWEST" ]; then
            echo "versionCode ${GITHUB_RUN_NUMBER} is not newer than build ${NEWEST}: phones would refuse it"; exit 1
          fi

      - name: Record the native fingerprint of this build
        # The release workflow compares it with later commits: same native layer →
        # over-the-air update; different → a new APK (see .github/workflows/release.yml).
        run: node scripts/native-fingerprint.mjs | tee native-fingerprint.json

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.name }}
          retention-days: 30

      - name: Publish the release with the APK
        # Published as the repository's latest release, with the APK attached twice:
        # under its versioned name, and as memory-match.apk — so
        # https://github.com/<repo>/releases/latest/download/memory-match.apk (the web
        # game's "Download the app", APP_DOWNLOAD_URL in src/lib/links.ts) is always
        # the newest test APK.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
            VERSION=$(node -p "require('./app.json').expo.version")
            TAG="apk-${VERSION}-build${GITHUB_RUN_NUMBER}"
          fi
          cp "${{ steps.apk.outputs.name }}" memory-match.apk
          gh release create "$TAG" "${{ steps.apk.outputs.name }}" memory-match.apk native-fingerprint.json \
            --latest \
            --target "$GITHUB_SHA" \
            --title "Test build ${TAG#apk-}" \
            --notes "Test APK for Android. Phones with the app get it inside the app (New version available → Install update). First install: open this page on the phone and tap memory-match.apk. Built from ${GITHUB_SHA::7}."

      - name: Check the stable download link
        run: |
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/memory-match.apk"
          for i in $(seq 1 12); do
            SIZE=$(curl -fsSL -o /dev/null -w '%{size_download}' "$URL" || echo 0)
            if [ "$SIZE" -gt 10000000 ]; then echo "$URL → ${SIZE} bytes"; exit 0; fi
            sleep 10
          done
          echo "$URL does not serve the APK"; exit 1

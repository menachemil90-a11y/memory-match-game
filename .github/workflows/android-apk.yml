name: Android test APK

# Builds an installable APK without an Expo account and publishes it as a
# GitHub pre-release. Triggered by a commit whose message contains "[apk]",
# a pushed tag "apk-*", or manually from the Actions tab.
on:
  push:
    branches: ['**']
    tags: ['apk-*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/apk-') ||
      contains(github.event.head_commit.message, '[apk]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # NODE_ENV=production is set only on the build steps below: at job level it
      # would make `npm ci` skip devDependencies and break `npm run check`.
      EXPO_NO_TELEMETRY: '1'
      # Online play: the public Supabase URL + anon key come from the committed .env
      # (do not set them here — an empty variable would override .env).
      GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx6g -XX:MaxMetaspaceSize=1g" -Dorg.gradle.workers.max=4
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install JS dependencies
        run: npm ci

      - name: Verify (typecheck, lint, tests)
        run: npm run check

      - name: Generate native Android project
        env:
          NODE_ENV: production
        run: npx expo prebuild --platform android --no-install --clean

      - name: Use the stable test-build signing key
        run: cp credentials/sideload.keystore android/app/debug.keystore

      - name: Build release APK
        working-directory: android
        env:
          NODE_ENV: production
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Name the APK
        id: apk
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          NAME="memory-match-${VERSION}-${GITHUB_SHA::7}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          ls -lh "$NAME"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.name }}
          retention-days: 30

      - name: Publish pre-release with the APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
            VERSION=$(node -p "require('./app.json').expo.version")
            TAG="apk-${VERSION}-build${GITHUB_RUN_NUMBER}"
          fi
          gh release create "$TAG" "${{ steps.apk.outputs.name }}" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Test build ${TAG#apk-}" \
            --notes "Installable test APK for Android (sideload). Built from ${GITHUB_SHA::7}. Open this page on your phone, tap the .apk file, and allow installing from your browser if asked."

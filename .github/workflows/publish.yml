name: Publish test APK

# The game's code repository (private) builds the test APK and pushes it here to
# the branch "incoming-apk" (one commit: the APK, native-fingerprint.json and
# release.json). This makes it the latest release, with the APK attached twice:
# under its versioned name and as memory-match.apk, so
# releases/latest/download/memory-match.apk is always the newest test APK.
on:
  push:
    branches: [incoming-apk]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: incoming-apk
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(jq -r .tag release.json)
          APK=$(jq -r .apk release.json)
          [[ "$TAG" =~ ^apk-[0-9.]+-build[0-9]+$ ]] || { echo "Bad tag: $TAG"; exit 1; }
          [[ "$APK" =~ ^memory-match-[0-9A-Za-z.-]+\.apk$ && -f "$APK" ]] || { echo "Bad APK: $APK"; exit 1; }
          test -f native-fingerprint.json
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "$TAG is already released"; exit 0
          fi
          cp "$APK" memory-match.apk
          gh release create "$TAG" "$APK" memory-match.apk native-fingerprint.json \
            --latest \
            --target main \
            --title "$(jq -r .title release.json)" \
            --notes "$(jq -r .notes release.json)"

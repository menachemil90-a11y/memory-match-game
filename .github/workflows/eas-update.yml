name: EAS Update (over-the-air)

# Ships JavaScript/asset changes to installed apps without a store review.
# Only builds with the same app version (runtimeVersion) receive the update.
# Needs the repository secret EXPO_TOKEN.
on:
  workflow_dispatch:
    inputs:
      channel:
        description: preview or production
        default: preview
        required: true
      message:
        description: What changed (shown in the EAS dashboard)
        required: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Publish update
        env:
          CHANNEL: ${{ inputs.channel }}
          MESSAGE: ${{ inputs.message }}
        run: npx eas-cli@latest update --non-interactive --channel "$CHANNEL" --message "$MESSAGE"

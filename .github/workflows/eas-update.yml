name: EAS Update (over-the-air)

# Ships JavaScript/asset changes to installed apps without a store review.
# Only builds with the same app version (runtimeVersion) receive the update.
# Needs the repository secret EXPO_TOKEN.
on:
  workflow_dispatch:
    inputs:
      channel:
        description: preview or production
        default: preview
        required: true
      message:
        description: What changed (shown in the EAS dashboard)
        required: true
  # Called by release.yml for every app change pushed to main.
  workflow_call:
    inputs:
      channel:
        type: string
        required: true
      message:
        type: string
        required: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      # Keeps the in-app test-APK update check working after an over-the-air
      # update (the update carries the app config; see app.config.js).
      APK_RELEASES_REPO: ${{ github.repository }}
      # Online play: the public Supabase URL + anon key come from the committed .env
      # (do not set them here — an empty variable would override .env).
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Hide the Expo account email in logs (logs of this public repo are public)
        run: |
          email=$(npx eas-cli@latest whoami 2>/dev/null | grep -o '[^[:space:]]*@[^[:space:]]*' | head -1 || true)
          if [ -n "$email" ]; then echo "::add-mask::$email"; fi
      - run: npm run check
      - name: Publish update
        env:
          CHANNEL: ${{ inputs.channel }}
          MESSAGE: ${{ inputs.message }}
        run: npx eas-cli@latest update --non-interactive --channel "$CHANNEL" --message "$MESSAGE"

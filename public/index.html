<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <!-- Link previews (WhatsApp, Telegram, Facebook, Messages…): first in <head>,
         because chat apps read only the beginning of a page. The invite page
         (join/index.html) gets its own title, text and image from scripts/build-web.mjs. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Memory Match" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:title" content="Play Memory Match with me! 🃏" />
    <meta
      property="og:description"
      content="A family memory game you play right in your browser — free, no download, no account."
    />
    <meta property="og:url" content="https://memorymatch-online.pages.dev/" />
    <meta property="og:image" content="https://memorymatch-online.pages.dev/og-image.png" />
    <meta
      property="og:image:secure_url"
      content="https://memorymatch-online.pages.dev/og-image.png"
    />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Memory Match — a matched pair of fox cards and a Play button"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Play Memory Match with me! 🃏" />
    <meta
      name="twitter:description"
      content="A family memory game you play right in your browser — free, no download, no account."
    />
    <meta name="twitter:image" content="https://memorymatch-online.pages.dev/og-image.png" />

    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, shrink-to-fit=no"
    />
    <title>%WEB_TITLE% — play online with a friend</title>
    <meta
      name="description"
      content="A family memory game. Tap the invite link and play with me right in your browser — no download, no account."
    />
    <meta name="theme-color" content="#5B3FD9" />
    <meta name="referrer" content="no-referrer" />
    <!--
      Template for the web game (Expo web export). The export injects the scripts.
      Absolute URLs must match WEB_GAME_URL in src/lib/links.ts (checked by
      src/features/web/__tests__/webTemplate.test.ts). No tracking, no analytics, no
      third-party requests: everything is served from this site.
    -->

    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
        margin: 0;
        background-color: #3e24a8; /* palette.grapeDark */
      }
      body {
        overflow: hidden;
        /* No pull-to-refresh or bounce while playing; no double-tap zoom on cards. */
        overscroll-behavior: none;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>Memory Match needs JavaScript to run in your browser.</noscript>
    <div id="root"></div>
  </body>
</html>
